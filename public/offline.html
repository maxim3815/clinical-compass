<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Нет подключения — Клинический компас</title>
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <meta name="color-scheme" content="only light" />
        <meta name="theme-color" content="#fbf9f5" />

        <!--
            Страницу показывает service worker, когда без сети не открылась страница приложения.
            Она лежит в кэше устройства, поэтому всё нужное — внутри файла. Цвета — как в
            resources/css/app.css, тема только светлая.
        -->

        <style>
            :root {
                color-scheme: light;
                --background: #fbf9f5;
                --foreground: #1e293b;
                --card: #ffffff;
                --muted-foreground: #5c6878;
                --border: #e6e2da;
                --primary: #235347;
                --primary-hover: #1b4339;
                --primary-foreground: #ffffff;
            }

            * {
                box-sizing: border-box;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                min-height: 100dvh;
                margin: 0;
                padding: 24px 16px;
                background: var(--background);
                color: var(--foreground);
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
                -webkit-font-smoothing: antialiased;
            }

            .page {
                display: flex;
                flex-direction: column;
                gap: 24px;
                width: 100%;
                max-width: 28rem;
            }

            .brand {
                display: flex;
                align-items: center;
                align-self: center;
                gap: 12px;
                font-size: 1.125rem;
                font-weight: 600;
            }

            .logo {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                height: 44px;
                border-radius: 12px;
                background: var(--primary);
                color: var(--primary-foreground);
            }

            .logo svg {
                width: 28px;
                height: 28px;
            }

            main {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
                padding: 24px;
                border: 1px solid var(--border);
                border-radius: 16px;
                background: var(--card);
                box-shadow: 0 1px 3px rgb(30 41 59 / 0.08);
            }

            h1 {
                margin: 0;
                font-size: 1.5rem;
                font-weight: 600;
                line-height: 1.3;
            }

            p {
                margin: 0;
                color: var(--muted-foreground);
                font-size: 1rem;
                line-height: 1.5;
            }

            button {
                width: 100%;
                height: 44px;
                padding: 0 20px;
                border: 0;
                border-radius: 12px;
                background: var(--primary);
                color: var(--primary-foreground);
                font: inherit;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
            }

            button:disabled {
                opacity: 0.7;
            }

            button:hover {
                background: var(--primary-hover);
            }

            button:focus-visible {
                outline: 2px solid var(--primary);
                outline-offset: 2px;
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="brand">
                <span class="logo">
                    <!-- Знак приложения, как в resources/js/components/AppLogoIcon.vue. -->
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="64 64 384 384"
                        aria-hidden="true"
                    >
                        <circle
                            cx="256"
                            cy="256"
                            r="172"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="32"
                        />
                        <path
                            d="M256 100v40M256 372v40M100 256h40M372 256h40"
                            stroke="currentColor"
                            stroke-width="24"
                            stroke-linecap="round"
                        />
                        <path
                            d="M339 173 232 232 280 280Z"
                            fill="currentColor"
                        />
                        <path
                            d="M173 339 232 232 280 280Z"
                            fill="currentColor"
                            fill-opacity="0.45"
                        />
                    </svg>
                </span>
                Клинический компас
            </div>
            <main>
                <h1>Нет подключения к интернету</h1>
                <p>
                    Если вы приняли препарат, отметьте приём на экране
                    «Сегодня», когда появится интернет. Это можно сделать за
                    сегодня и вчера.
                </p>
                <p>Страница откроется сама, когда сеть появится.</p>
                <button type="button" id="retry">Повторить</button>
            </main>
        </div>
        <script>
            // Сеть вернулась — открываем страницу заново, без нажатия.
            window.addEventListener('online', () => location.reload());

            document
                .getElementById('retry')
                .addEventListener('click', (event) => {
                    event.currentTarget.disabled = true;
                    event.currentTarget.textContent = 'Проверяем…';
                    location.reload();
                });
        </script>
    </body>
</html>

# Алерт, когда пациент сообщил о побочном эффекте, о котором по листку-вкладышу нужно сразу
# сообщить врачу или нужна помощь сейчас. Загружается командой `php artisan app:alerts:import`,
# формат описан в README.
#
# Условия нет: какие симптомы срочные, задают группы в database/data/side-effects.yaml.
# Пока алерт открыт, новый срочный симптом пишется в него же. Текст и уровень проверяет
# медик команды [медик].

code: adverse_event
name: Срочный побочный эффект
level: critical
trigger: adverse_event
text: >-
  Пациент сообщил о побочном эффекте, о котором по инструкции к препарату нужно сразу сообщить
  врачу. Свяжитесь с пациентом и решите, что делать с терапией.

# Алерт по кнопке «Сообщить врачу» на экране помощи пациента. Условия нет: тревогу поднимает
# сам пациент. Подтверждения и отмены у кнопки нет, ложная тревога дешевле пропущенной.
# Повторное нажатие, пока алерт открыт, пишется в тот же алерт и снова поднимает плашку у врача.
#
# Название, текст и уровень проверяет медик команды [медик].

code: help_request
name: Просьба о помощи
level: critical
trigger: help_request
text: >-
  Пациент сам попросил связаться с экрана помощи. Свяжитесь с пациентом и оцените суицидальный риск.

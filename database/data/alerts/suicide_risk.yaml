# Алерт о суицидальном риске по 9-му вопросу PHQ-9: любой ответ, кроме «совсем нет».
# Загружается командой `php artisan app:alerts:import` после опросников, формат описан в README.
#
# Ложная тревога дешевле пропуска: порог — балл 1 и выше. Порог, текст и уровень проверяет
# медик команды [медик].

code: suicide_risk
name: Суицидальный риск
level: critical
condition: answer('phq9', 9) >= 1
text: >-
  Пациент отметил мысли о том, что лучше умереть, или о причинении себе вреда. Оцените суицидальный
  риск в клинической беседе.
source:
  document: Instructions for Patient Health Questionnaire (PHQ) and GAD-7 Measures (Pfizer)
  section: Coding and Scoring, с. 2
  url: https://www.phqscreeners.com/images/sites/g/files/g10016261/f/201412/instructions.pdf
  quote: >-
    A particularly important question is how to assess suicide risk in individuals who answer positively to
    the 9th question of the PHQ-9. A four-item screener has been developed that may assist in positive
    responses to this 9th question, although a final decision about the actual risk of self-harm requires
    a clinical interview.

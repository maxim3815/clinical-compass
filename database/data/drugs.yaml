# Справочник препаратов. Загружается командой `php artisan app:drugs:import`, формат описан в README.
#
# Запись — препарат по МНН. Источник у записи один: листок-вкладыш конкретного препарата из ГРЛС.
# window_hours — через сколько часов после планового времени пропущенную дозу уже не принимают.
# Пусто (~), если в источнике окно в часах не задано: тогда действует правило по умолчанию.
# groups — группы для правил взаимодействий, коды из drug-groups.yaml.
# trade_names — торговые названия для поиска, когда пациент добавляет препарат от другого врача сам. Сверены с ГРЛС
# 26.10.2026. У «Авиандра» название в интерфейсе уже торговое.

- code: maritupirdine
  name: Авиандр
  inn: маритупирдин
  atc: N05BX
  trade_names: []
  groups: []
  dosage_form: таблетки, покрытые плёночной оболочкой
  strengths:
    # Риски нет, таблетку проглатывают целиком.
    - mg: 20
      divisible: false
  regimen: >-
    20 мг 2 раза в сутки, утром и вечером, за 30 минут до еды. ГТР: длительность определяет врач. Тревожные
    состояния, в том числе после COVID-19: 4 недели, при необходимости до 6. Титрования нет, постепенная отмена не
    требуется.
  patient_instruction: За 30 минут до еды. Проглотите таблетку целиком, не разжёвывая.
  missed_dose: Пропущенную таблетку не принимайте и не удваивайте дозу. Следующую примите в обычное время.
  window_hours: ~
  source:
    trade_name: Авиандр
    document: Листок-вкладыш из ГРЛС
    registration_number: ЛП-№(002445)-(РГ-RU)
    url: https://grls.minzdrav.gov.ru/InstrImg/2026/07/29/1532717/94ba54dc-ce1c-40ed-96f4-5c3a31f13805.pdf
    edition: Изм. № 0, 2026, выложен 29.07.2026

- code: escitalopram
  name: Эсциталопрам
  inn: эсциталопрам
  atc: N06AB10
  trade_names: [Ципралекс, Селектра]
  # СИОЗС: серотонинергический и ингибитор CYP2D6 (ОХЛП 4.5). Удлиняет QT: назван в ОХЛП «Атаракса» 4.5.
  groups: [serotonergic, cyp2d6_inhibitor, qt_prolonging]
  dosage_form: таблетки, покрытые плёночной оболочкой
  strengths:
    - mg: 10
      divisible: true
  regimen: >-
    1 раз в сутки, независимо от еды. ГТР и депрессия: 10 мг, максимум 20 мг/сут. Старше 65 лет: 5 мг, максимум
    10 мг. Лёгкая и умеренная печёночная недостаточность, медленные метаболизаторы CYP2C19: 5 мг первые 2 недели,
    затем до 10 мг. Отменять постепенно, за 1–2 недели или дольше.
  patient_instruction: "Независимо от еды. Запейте водой, не разжёвывайте: таблетка горькая."
  missed_dose: >-
    Не принимайте двойную дозу. Если вспомнили до того, как легли спать, примите пропущенную таблетку сразу, а завтра
    как обычно. Если вспомнили ночью или на следующий день, пропущенную не принимайте, следующую примите в обычное
    время.
  # Листок-вкладыш задаёт окно словами («до того, как легли спать»), а не в часах.
  window_hours: ~
  source:
    trade_name: Ципралекс
    document: Листок-вкладыш из ГРЛС
    registration_number: ЛП-№(011897)-(РГ-RU)
    url: https://grls.minzdrav.gov.ru/InstrImg/2025/10/31/1523077/f3b1f4c4-b635-4e9b-9a49-9cca43b48fd4.pdf
    edition: выложен 31.10.2025

- code: sertraline
  name: Сертралин
  inn: сертралин
  atc: N06AB06
  trade_names: [Золофт, Асентра, Стимулотон]
  # СИОЗС: назван в листке «Авиандра» среди препаратов, влияющих на обмен серотонина. Ингибитор CYP2D6 (ОХЛП 4.5).
  groups: [serotonergic, cyp2d6_inhibitor]
  dosage_form: таблетки, покрытые плёночной оболочкой
  strengths:
    - mg: 50
      divisible: true
    # Риски нет.
    - mg: 100
      divisible: false
  regimen: >-
    1 раз в сутки утром или вечером, независимо от еды. Депрессия: 50 мг, повышать на 50 мг не чаще раза в неделю,
    максимум 200 мг/сут. ГТР в показаниях нет (в клинических рекомендациях вне инструкции, 50–200 мг/сут). Паника,
    социальная тревога, ПТСР: первая неделя 25 мг. Отменять постепенно, за 1–2 недели или дольше.
  patient_instruction: Независимо от еды. Во время лечения не пейте грейпфрутовый сок.
  missed_dose: Пропущенную дозу не принимайте и следующую не удваивайте. Примите её в обычное время.
  window_hours: ~
  source:
    trade_name: Золофт
    document: Листок-вкладыш из ГРЛС
    registration_number: ЛП-№(002851)-(РГ-RU)
    url: https://grls.minzdrav.gov.ru/InstrImg/2026/06/25/1531405/0fb75e32-9d37-4219-9320-c62187c2ddc9.pdf
    edition: выложен 25.06.2026

- code: paroxetine
  name: Пароксетин
  inn: пароксетин
  atc: N06AB05
  trade_names: [Паксил, Рексетин]
  # Назван в листке «Авиандра» в обеих группах.
  groups: [serotonergic, cyp2d6_inhibitor]
  dosage_form: таблетки, покрытые плёночной оболочкой
  strengths:
    - mg: 20
      divisible: true
  regimen: >-
    1 раз в сутки утром во время еды. ГТР и депрессия: 20 мг, повышать на 10 мг, максимум 50 мг/сут, пожилым максимум
    40 мг. Отмена: снижать на 10 мг в неделю, на 20 мг/сут остаться неделю, затем отменить.
  patient_instruction: Утром во время еды. Проглотите, не разжёвывая, запейте водой.
  missed_dose: Не принимайте двойную дозу. Следующую примите в обычное время. Если сомневаетесь, спросите врача.
  window_hours: ~
  source:
    trade_name: Паксил
    document: Листок-вкладыш из ГРЛС
    registration_number: ЛП-№(000746)-(РГ-RU)
    url: https://grls.minzdrav.gov.ru/InstrImg/2026/10/15/1535561/2826d4c4-f3d1-44f6-9779-74f7f7bcec16.pdf
    edition: выложен 15.10.2026

- code: hydroxyzine
  name: Гидроксизин
  inn: гидроксизин
  atc: N05BB01
  trade_names: [Атаракс]
  # Назван в листке «Авиандра» среди противотревожных. Удлиняет QT (ОХЛП 4.4). Ингибирует CYP2D6
  # (ОХЛП 4.5), но в списке ингибиторов «Авиандра» не назван, поэтому в группу не входит [медик].
  groups: [sedative, qt_prolonging]
  dosage_form: таблетки, покрытые плёночной оболочкой
  strengths:
    - mg: 25
      divisible: true
  regimen: >-
    Тревога: 50–100 мг/сут. Если тревога проявляется в основном бессонницей, принимают вечером перед сном. Максимум
    100 мг/сут, пожилым 50 мг. Начинать с низкой дозы, курс как можно короче. Кратность при тревоге без бессонницы в
    инструкции не задана.
  patient_instruction: Может вызывать сонливость. Во время лечения не садитесь за руль и не пейте алкоголь.
  missed_dose: Не принимайте двойную дозу. Следующую примите в обычное время.
  window_hours: ~
  source:
    trade_name: Атаракс
    document: Листок-вкладыш из ГРЛС
    registration_number: ЛП-№(004181)-(РГ-RU)
    url: https://grls.minzdrav.gov.ru/InstrImg/2026/02/05/1526069/340a1222-cbac-44a2-9fe2-8a45f558dda6.pdf
    edition: выложен 05.02.2026

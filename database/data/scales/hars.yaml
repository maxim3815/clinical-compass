# Шкала тревоги Гамильтона HARS: шкала врача, её заполняет психиатр на приёме.
# Загружается командой `php artisan app:scales:import`, формат описан в README.
#
# Пункты, подсказки к ним, варианты ответа, инструкция и степени по сумме — дословно из клинической
# рекомендации Минздрава России «Генерализованное тревожное расстройство» (2024), приложение Г1.
# Названия 7-го, 8-го и 11-го пунктов — из ключа того же приложения: в перечне пунктов оба
# соматических пункта названы одинаково, а в 11-м опечатка («Гастроинтестиальные»).

code: hars
name: HARS
title: Шкала М. Гамильтона для оценки тревоги
# Заполняет врач: нейтрального названия для пациента и календаря у шкалы нет. Терапевт её
# не заполняет: интервью на 20–30 минут, у него HADS.
rater: doctor
doctor_kind: psychiatrist
position: 1
instruction: >-
  Заполнение шкалы происходит в процессе полуструктурированного интервью, во время которого специалист
  в том числе собирает анамнестические сведения и наблюдает за поведением и другими невербальными
  проявлениями исследуемых психопатологических феноменов. Не следует предъявлять шкалу пациенту
  и задавать ему прямые вопросы.
options:
  - score: 0
    label: Отсутствует
  - score: 1
    label: В слабой степени
  - score: 2
    label: В умеренной степени
  - score: 3
    label: В тяжелой степени
  - score: 4
    label: В очень тяжелой степени
items:
  - text: Тревожное настроение
    hint: озабоченность, ожидание наихудшего, тревожные опасения, раздражительность
  - text: Напряжение
    hint: ощущение напряжения, вздрагивание, легко возникающая плаксивость, дрожь, чувство беспокойства, неспособность расслабиться
  - text: Страхи
    hint: боязнь темноты, незнакомых людей, животных, транспорта, толпы, страх оставаться одному
  - text: Инсомния
    hint: затрудненное засыпание, прерывистый сон, не приносящий отдыха сон с чувством разбитости и слабости при пробуждении, кошмарные сновидения
  - text: Интеллектуальные нарушения
    hint: затрудненная концентрация внимания, ухудшение памяти
  - text: Депрессивное настроение
    hint: утрата привычных интересов, утрата чувства удовольствия от хобби, подавленность, ранние пробуждения, суточные колебания состояния
  - text: Соматические симптомы (мышечные)
    hint: боли, мышечные подергивания, напряжение, миоклонические судороги, «скрипение» зубами, срывающийся голос, повышенный мышечный тонус
  - text: Соматические симптомы (сенсорные)
    hint: звон в ушах, нечеткость зрения, приливы жара или холода, ощущение слабости, ощущение покалывания
  - text: Сердечно-сосудистые симптомы
    hint: тахикардия, сердцебиение, боль в груди, пульсация в сосудах, чувство слабости, частые вздохи, диспноэ
  - text: Респираторные симптомы
    hint: чувство давления или сжатия грудной клетки, ощущение удушья, частые вздохи, диспноэ
  - text: Гастроинтестинальные симптомы
    hint: затрудненное глотание, метеоризм, боль в животе, изжога, чувство переполнения желудка, тошнота, рвота, урчание в животе, диарея, снижение веса тела, запоры
  - text: Мочеполовые симптомы
    hint: учащенное мочеиспускание, сильные позывы на мочеиспускание, аменорея, меноррагия, фригидность, преждевременная эякуляция, утрата либидо, импотенция
  - text: Вегетативные симптомы
    hint: сухость во рту, покраснение кожных покровов, бледность кожных покровов, повышенное потоотделение, головные боли с чувством напряжения
  - text: Поведение при осмотре
    hint: ерзанье на месте, беспокойная жестикуляция или походка, тремор рук, нахмуривание бровей, напряженное выражение лица, вздохи или учащенное дыхание, бледность лица, частое сглатывание слюны и т.д.
# Степени по сумме баллов — по ключу приложения Г1.
bands:
  - min: 0
    max: 7
    label: отсутствие тревоги
  - min: 8
    max: 17
    label: симптомы тревожного расстройства
  - min: 18
    max: 24
    label: средняя выраженность тревожного расстройства
  - min: 25
    max: 56
    label: тяжелая степень выраженности тревожного расстройства
source:
  original: >-
    Hamilton M. The assessment of anxiety states by rating // British Journal of Medical Psychology. 1959.
    Vol. 32, № 1. P. 50–55.
  validation: >-
    Клинические рекомендации «Генерализованное тревожное расстройство». Российское общество психиатров,
    Минздрав России, 2024 (ID 457_3). Приложение Г1 «Шкала М. Гамильтона для оценки тревоги».
  url: https://cr.minzdrav.gov.ru/view-cr/457_3
  license: >-
    Опубликована в 1959 году и находится в открытом доступе: разрешение на использование не требуется.
    Русский текст — из клинической рекомендации Минздрава России.
  note: >-
    Заполняет врач в полуструктурированном интервью, обследование занимает 20–30 минут. Первые шесть
    пунктов — тревога в сфере психики, остальные восемь — в соматической сфере.

# Опросник здоровья пациента PHQ-9 (депрессия): опросник, который заполняет пациент.
# Загружается командой `php artisan app:scales:import`, формат описан в README.
#
# Инструкция, вопросы и варианты ответа — дословно из русскоязычной версии, которую проверила
# А. А. Золотарева (приложение к статье, ссылка в source). Степени по сумме — по Kroenke et al.,
# 2001. 10-й вопрос оригинала о трудностях в повседневной жизни в сумму не входит, его нет.
# Название для пациента и названия степеней проверяет медик [медик].

code: phq9
name: PHQ-9
title: Опросник здоровья пациента
# Пациент видит нейтральное название, без слов о расстройстве [медик].
patient_title: Настроение
position: 2
instruction: >-
  Оцените, пожалуйста, насколько часто следующие проблемы беспокоили вас в течение прошедших двух недель.
options:
  - score: 0
    label: Совсем нет
  - score: 1
    label: В течение нескольких дней
  - score: 2
    label: Более, чем половину этого времени
  - score: 3
    label: Почти каждый день
items:
  - text: Снижение интереса и удовольствия от привычных дел
  - text: Чувство подавленности или безнадежности
  - text: Проблемы со сном (неспособность заснуть, раннее пробуждение или слишком долгий сон)
  - text: Чувство усталости или недостатка энергии
  - text: Плохой аппетит или переедание
  - text: Плохое мнение о себе или чувство, что не смог оправдать ожиданий моей семьи
  - text: Проблемы с концентрацией внимания (например, при чтении газеты или просмотре телевизионной передачи)
  - text: >-
      Замедленность движений или речи, которая стала заметна другим людям, или, напротив, суетливость,
      когда движения и речь стали более быстрыми и беспокойными
  # Мысли о смерти и самоповреждении: врач видит ответ на этот вопрос отдельно в каждом заполнении.
  - text: Мысли о том, что мне бы хотелось умереть или причинить себе боль
    highlight: true
bands:
  - min: 0
    max: 4
    label: минимальная депрессия
  - min: 5
    max: 9
    label: лёгкая депрессия
  - min: 10
    max: 14
    label: умеренная депрессия
  - min: 15
    max: 19
    label: умеренно тяжёлая депрессия
  - min: 20
    max: 27
    label: тяжёлая депрессия
# Те же сроки, что у GAD-7: оба опросника заполняются вместе.
schedule:
  days: [0, 7, 14, 28]
  then_every: 28
source:
  original: >-
    Kroenke K., Spitzer R. L., Williams J. B. W. The PHQ-9: validity of a brief depression severity measure //
    Journal of General Internal Medicine. 2001. Vol. 16, № 9. P. 606–613.
  validation: >-
    Золотарева А. А. Диагностика депрессии: психометрическая оценка русскоязычной версии опросника здоровья
    пациента (Patient Health Questionnaire-9, PHQ-9) // Клиническая и специальная психология. 2023. Т. 12, № 4.
    С. 107–121.
  url: https://doi.org/10.17759/cpse.2023120406
  license: >-
    Распространяется свободно: разрешения на перевод, воспроизведение и распространение не требуется
    (Pfizer Inc., спонсор разработки).
  note: >-
    В клинических рекомендациях Минздрава России по ГТР и депрессии не названа, выбрана по проверенной
    русскоязычной версии.

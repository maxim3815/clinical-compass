# Шкала генерализованного тревожного расстройства GAD-7: опросник, который заполняет пациент.
# Загружается командой `php artisan app:scales:import`, формат описан в README.
#
# Инструкция, вопросы и варианты ответа — дословно из русскоязычной версии, которую проверила
# А. А. Золотарева (приложение к статье, ссылка в source). Степени по сумме — по той же статье
# и по Spitzer et al., 2006. Название для пациента и названия степеней проверяет медик [медик].

code: gad7
name: GAD-7
title: Шкала генерализованного тревожного расстройства
# Пациент видит нейтральное название, без слов о расстройстве [медик].
patient_title: Беспокойство
# Порядок опросников при заполнении: сначала GAD-7, потом PHQ-9.
position: 1
instruction: >-
  Оцените, пожалуйста, насколько часто следующие проблемы беспокоили вас в течение прошедших двух недель.
options:
  - score: 0
    label: Совсем нет
  - score: 1
    label: В течение нескольких дней
  - score: 2
    label: Более чем половину этого времени
  - score: 3
    label: Почти каждый день
items:
  - text: Чувство тревоги или раздражения
  - text: Неспособность справиться со своим беспокойством
  - text: Чрезмерное беспокойство по разным поводам
  - text: Неспособность расслабляться
  - text: Ощущение такого беспокойства, что трудно найти себе место
  - text: Склонность быстро испытывать злость или раздражительность
  - text: Чувство страха, как будто может случиться что-то ужасное
# Степени по сумме баллов: от 0 до наибольшей суммы без пропусков. Видит только врач.
bands:
  - min: 0
    max: 4
    label: минимальная тревога
  - min: 5
    max: 9
    label: лёгкая тревога
  - min: 10
    max: 14
    label: умеренная тревога
  - min: 15
    max: 21
    label: выраженная тревога
# Сроки от начала наблюдения у текущего врача: дни 0 (регистрация), 7, 14, 28, дальше каждые
# 28 дней. Так в клинической рекомендации по ГТР: оценка на 7-й, 14-й и 28-й день, затем раз
# в 4 недели.
schedule:
  days: [0, 7, 14, 28]
  then_every: 28
source:
  original: >-
    Spitzer R. L., Kroenke K., Williams J. B. W., Löwe B. A brief measure for assessing generalized anxiety
    disorder: the GAD-7 // Archives of Internal Medicine. 2006. Vol. 166, № 10. P. 1092–1097.
  validation: >-
    Золотарева А. А. Адаптация русскоязычной версии шкалы генерализованного тревожного расстройства
    (Generalized Anxiety Disorder-7) // Консультативная психология и психотерапия. 2023. Т. 31, № 4. С. 31–46.
  url: https://doi.org/10.17759/cpp.2023310402
  license: >-
    Распространяется свободно: разрешения на перевод, воспроизведение и распространение не требуется
    (Pfizer Inc., спонсор разработки).
  note: >-
    Названа в клинической рекомендации Минздрава России «Генерализованное тревожное расстройство» (2024)
    для скрининга.

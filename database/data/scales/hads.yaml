# Госпитальная шкала тревоги и депрессии HADS: шкала врача, её заполняет терапевт на приёме.
# Загружается командой `php artisan app:scales:import`, формат описан в README.
#
# Утверждения, варианты ответа с баллами, пояснение и ключ — дословно из клинической рекомендации
# Минздрава России «Митральная недостаточность» (2024), приложение Г1. Утверждения о тревоге (Т)
# и депрессии (Д) идут вперемешку, как в таблице источника: строка за строкой, сначала Т, потом Д.
# Отличие от источника одно: первая буква утверждения заглавная. В других рекомендациях
# с этой шкалой («Эпилепсия и эпилептический статус», «Когнитивные расстройства у лиц пожилого
# и старческого возраста») формулировки местами другие. Пороги направления к психиатру —
# в referral-rules.yaml [медик].

code: hads
name: HADS
title: Госпитальная шкала тревоги и депрессии
# Заполняет врач: нейтрального названия для пациента и календаря у шкалы нет. Психиатр её
# не заполняет, у него HARS.
rater: doctor
doctor_kind: therapist
position: 2
# Строка над утверждениями для того, кто отвечает, — текст интерфейса, а не шкалы: период
# из пояснения приложения Г1.
prompt: Как вы себя чувствовали последние 7 дней? Для каждого утверждения выберите ответ, который подходит больше всего.
instruction: >-
  Каждому утверждению шкалы HADS соответствуют 4 варианта ответа. Больного просят выбрать тот ответ,
  который соответствует его состоянию в течение последних 7 дней, затем баллы суммируются отдельно
  для каждой части.
items:
  - text: Я испытываю напряженность, мне не по себе
    subscale: anxiety
    options:
      - { score: 3, label: "все время" }
      - { score: 2, label: "часто" }
      - { score: 1, label: "время от времени, иногда" }
      - { score: 0, label: "совсем не испытываю" }
  - text: То, что приносило мне большое удовольствие, и сейчас вызывает у меня такое же чувство
    subscale: depression
    options:
      - { score: 0, label: "определенно это так" }
      - { score: 1, label: "наверное, это так" }
      - { score: 2, label: "лишь в очень малой степени это так" }
      - { score: 3, label: "это совсем не так" }
  - text: Я испытываю страх, кажется, будто что-то ужасное может вот-вот случиться
    subscale: anxiety
    options:
      - { score: 3, label: "определенно это так, и страх очень сильный" }
      - { score: 2, label: "да, это так, но страх не очень сильный" }
      - { score: 1, label: "иногда, но это меня не беспокоит" }
      - { score: 0, label: "совсем не испытываю" }
  - text: Я способен рассмеяться и увидеть в том или ином событии смешное
    subscale: depression
    options:
      - { score: 0, label: "определенно это так" }
      - { score: 1, label: "наверное, это так" }
      - { score: 2, label: "лишь в очень малой степени это так" }
      - { score: 3, label: "совсем не способен" }
  - text: Беспокойные мысли крутятся у меня в голове
    subscale: anxiety
    options:
      - { score: 3, label: "постоянно" }
      - { score: 2, label: "большую часть времени" }
      - { score: 1, label: "время от времени и не так часто" }
      - { score: 0, label: "только иногда" }
  - text: Я испытываю бодрость
    subscale: depression
    options:
      - { score: 3, label: "совсем не испытываю" }
      - { score: 2, label: "очень редко" }
      - { score: 1, label: "иногда" }
      - { score: 0, label: "практически все время" }
  - text: Я легко могу сесть и расслабиться
    subscale: anxiety
    options:
      - { score: 0, label: "определенно это так" }
      - { score: 1, label: "наверное, это так" }
      - { score: 2, label: "лишь изредка это так" }
      - { score: 3, label: "совсем не могу" }
  - text: Мне кажется, что я стал все делать очень медленно
    subscale: depression
    options:
      - { score: 3, label: "практически все время" }
      - { score: 2, label: "часто" }
      - { score: 1, label: "иногда" }
      - { score: 0, label: "совсем не так" }
  - text: Я испытываю внутреннее напряжение или дрожь
    subscale: anxiety
    options:
      - { score: 0, label: "совсем не испытываю" }
      - { score: 1, label: "иногда" }
      - { score: 2, label: "часто" }
      - { score: 3, label: "очень часто" }
  - text: Я не слежу за своей внешностью
    subscale: depression
    options:
      - { score: 3, label: "определенно это так" }
      - { score: 2, label: "я не уделяю этому столько времени, сколько нужно" }
      - { score: 1, label: "может быть, я стал меньше уделять этому внимания" }
      - { score: 0, label: "я слежу за собой так же, как и раньше" }
  - text: Я испытываю неусидчивость, словно мне постоянно нужно двигаться
    subscale: anxiety
    options:
      - { score: 3, label: "определенно это так" }
      - { score: 2, label: "наверное, это так" }
      - { score: 1, label: "лишь в некоторой степени это так" }
      - { score: 0, label: "совсем не испытываю" }
  - text: Я считаю, что мои дела (занятия, увлечения) могут принести мне чувство удовлетворения
    subscale: depression
    options:
      - { score: 0, label: "точно так же, как и обычно" }
      - { score: 1, label: "да, но не в той степени, как и раньше" }
      - { score: 2, label: "значительно меньше, чем обычно" }
      - { score: 3, label: "совсем так не считаю" }
  - text: У меня бывает внезапное чувство паники
    subscale: anxiety
    options:
      - { score: 3, label: "очень часто" }
      - { score: 2, label: "довольно часто" }
      - { score: 1, label: "не так уж часто" }
      - { score: 0, label: "совсем не бывает" }
  - text: Я могу получить удовольствие от хорошей книги, радио- или телепрограммы
    subscale: depression
    options:
      - { score: 0, label: "часто" }
      - { score: 1, label: "иногда" }
      - { score: 2, label: "редко" }
      - { score: 3, label: "очень редко" }
# Степени по сумме каждой подшкалы — по ключу приложения Г1 («тревоги/депрессии» разведены
# по подшкалам). У нормы — только название степени, без пояснения в скобках («отсутствие
# достоверно выраженных симптомов»). Пороги направления к психиатру — в referral-rules.yaml.
subscales:
  - code: anxiety
    name: тревога
    bands:
      - min: 0
        max: 7
        label: норма
      - min: 8
        max: 10
        label: субклинически выраженная тревога
      - min: 11
        max: 21
        label: клинически выраженная тревога
  - code: depression
    name: депрессия
    bands:
      - min: 0
        max: 7
        label: норма
      - min: 8
        max: 10
        label: субклинически выраженная депрессия
      - min: 11
        max: 21
        label: клинически выраженная депрессия
source:
  original: >-
    Zigmond A. S., Snaith R. P. The Hospital Anxiety and Depression Scale // Acta Psychiatrica Scandinavica.
    1983. Vol. 67, № 6. P. 361–370. DOI 10.1111/j.1600-0447.1983.tb09716.x
  validation: >-
    Клинические рекомендации «Митральная недостаточность». Ассоциация сердечно-сосудистых хирургов России,
    Российское кардиологическое общество и др., Минздрав России, 2024 (ID 881_1). Приложение Г1
    «Госпитальная шкала тревоги и депрессии (Hospital Anxiety and Depression Scale, HADS)».
  url: https://cr.minzdrav.gov.ru/view-cr/881_1
  license: >-
    Защищена авторским правом, правообладатель — GL Assessment. Для использования в продукте нужна
    лицензия правообладателя. Русский текст — из клинической рекомендации Минздрава России.
  note: >-
    Шкала самоотчёта на 2–5 минут: пациент отвечает сам, терапевт зачитывает утверждения или даёт
    пациенту ответить на своём экране. Баллы считаются отдельно по тревоге и по депрессии, от 0 до 21.

# Группы препаратов для правил взаимодействий. Загружаются вместе со справочником препаратов
# командой `php artisan app:drugs:import`, формат описан в README.
#
# Кто входит в группу, записано у препарата в drugs.yaml и known-drugs.yaml (поле groups). Правила
# ссылаются на группу по коду: taking_group('serotonergic'). Состав групп собран по разделам 4.5 ОХЛП
# и листкам-вкладышам препаратов справочника [медик].
#
# Препарат входит в группу, только если правило каждого препарата справочника по этой группе его
# покрывает. Если формулировка инструкции уже группы, нужна подгруппа: необратимые и обратимые ИМАО,
# антикоагулянты внутри препаратов, повышающих риск кровотечения.

- code: maoi
  name: Ингибиторы МАО

# Сертралин противопоказан с необратимыми ИМАО (ОХЛП 4.3), «Ципралекс» по листку-вкладышу — с
# необратимыми ингибиторами МАО-B.
- code: maoi_irreversible
  name: Необратимые ингибиторы МАО

# Эсциталопрам противопоказан с обратимыми ингибиторами МАО-А и линезолидом (ОХЛП 4.3), сертралин —
# по листку-вкладышу «не применяйте вместе».
- code: maoi_reversible
  name: Обратимые ингибиторы МАО

- code: serotonergic
  name: Серотонинергические препараты

- code: cyp2d6_inhibitor
  name: Ингибиторы CYP2D6

# Эсциталопрам: осторожность с ингибиторами CYP2C19 (ОХЛП 4.5).
- code: cyp2c19_inhibitor
  name: Ингибиторы CYP2C19

- code: sedative
  name: Препараты с седативным действием

- code: qt_prolonging
  name: Препараты, удлиняющие интервал QT

# Три СИОЗС: осторожность с НПВС, ацетилсалициловой кислотой, антиагрегантами и антикоагулянтами
# (ОХЛП 4.4).
- code: bleeding
  name: Препараты, повышающие риск кровотечения

# Гидроксизин: контроль гемостаза в начале терапии у пациентов на антикоагулянтах (ОХЛП 4.5).
- code: anticoagulant
  name: Антикоагулянты

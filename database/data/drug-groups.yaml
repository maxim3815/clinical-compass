# Группы препаратов для правил взаимодействий. Загружаются вместе со справочником препаратов
# командой `php artisan app:drugs:import`, формат описан в README.
#
# Кто входит в группу, записано у препарата в drugs.yaml (поле groups). Правила ссылаются на группу
# по коду: taking_group('serotonergic'). Состав групп собран по разделам 4.5 ОХЛП и листкам-вкладышам
# препаратов справочника [медик].

- code: maoi
  name: Ингибиторы МАО

- code: serotonergic
  name: Серотонинергические препараты

- code: cyp2d6_inhibitor
  name: Ингибиторы CYP2D6

- code: sedative
  name: Препараты с седативным действием

- code: qt_prolonging
  name: Препараты, удлиняющие интервал QT

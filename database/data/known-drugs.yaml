# Список препаратов от других врачей. Загружается вместе со справочником командой
# `php artisan app:drugs:import`, формат описан в README.
#
# Препарат из списка пациент добавляет сам, назначить его врач не может. Своих правил у препаратов списка нет:
# по группам на них срабатывают правила пяти препаратов справочника. Пару двух препаратов списка правила не
# проверяют: инструкций этих препаратов у нас нет.
#
# В списке препараты, которые инструкции препаратов справочника называют по имени, и распространённые в РФ
# представители названных там классов (пометка [медик] в reason). Препарат входит в группу, только если правило
# каждого препарата справочника по этой группе его покрывает (drug-groups.yaml).
#
# Регистрация в РФ и торговые названия сверены с ГРЛС 26.10.2026. registration — одно РУ из ГРЛС. Торговое
# название из trade_names есть в ГРЛС целиком или как начало названия («Трамал» — «Трамал ретард»).
# Комбинированные препараты («Кардиомагнил», «Корвалол», «Залдиар») записаны торговыми названиями того МНН, по
# которому они входят в группу [медик].
#
# Не вошли: моклобемид, селегилин, хинидин, дизопирамид, пимозид, тиклопидин и циметидин — их называют инструкции,
# но в ГРЛС их нет; сафинамид — обратимый ингибитор МАО-B, его не покрывает правило эсциталопрама; зверобой —
# «Негрустина» и «Деприма» в ГРЛС нет.


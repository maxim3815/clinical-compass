# Правила проверки назначения эсциталопрама. Источник — оригинальный препарат «Ципралекс».
# Загружаются командой `php artisan app:rules:import`, формат и язык условий описаны в README.
#
# Источники:
# - общая характеристика (ОХЛП) «Ципралекса» из реестра ЕАЭС. Ссылка на сам файл одноразовая, поэтому
#   у правил ссылка на реестр, препарат ищется по названию;
# - листок-вкладыш «Ципралекса» из ГРЛС, 2025.
# Тексты, уровни и коды МКБ-10 показаний проверяет медик команды [медик].

drug: escitalopram
rules:
  - id: indications
    type: indication
    level: contraindicated
    # Большие депрессивные эпизоды — F32 и F33, паника — F41.0 и F40.0, социальная фобия — F40.1,
    # ОКР — F42, ГТР — F41.1 [медик].
    codes: [F32, F33, F41.0, F40.0, F40.1, F41.1, F42]
    text: >-
      Назначение вне зарегистрированных показаний. Эсциталопрам показан взрослым при больших депрессивных
      эпизодах, паническом, социальном тревожном, генерализованном тревожном и обсессивно-компульсивном расстройствах.
    source:
      document: ОХЛП «Ципралекс», реестр ЕАЭС
      section: 4.1. Показания к применению
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Лекарственный препарат Ципралекс показан к применению у взрослых для лечения больших депрессивных
        эпизодов; панического расстройства с/без агорафобии; социального тревожного расстройства (социальной фобии);
        генерализованного тревожного расстройства; обсессивно-компульсивного расстройства.

  # Необратимые ингибиторы МАО-B (разагилин) раздел 4.3 не называет, для них отдельное правило maoi_b.
  - id: maoi
    type: contraindication
    level: contraindicated
    condition: taking_group('maoi_reversible') or fact('maoi')
    text: >-
      Противопоказан вместе с ингибиторами МАО из-за риска серотонинового синдрома, в том числе с обратимыми
      ингибиторами МАО-А и линезолидом. Начинать не раньше чем через 14 дней после отмены необратимых ИМАО.
    source:
      document: ОХЛП «Ципралекс», реестр ЕАЭС
      section: 4.3. Противопоказания
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Одновременный прием неселективных необратимых ингибиторов моноаминоксидазы (МАО) противопоказан из-за риска
        развития серотонинового синдрома… Применение эсциталопрама в комбинации с обратимыми ингибиторами МАО-А
        (например, моклобемидом) или обратимым неселективным ингибитором МАО линезолидом противопоказано из-за риска
        возникновения серотонинового синдрома…

  # В ОХЛП (4.5) для селегилина «необходимо соблюдать осторожность», листок-вкладыш строже: противопоказан.
  # Берём листок, как с беременностью у «Авиандра». Разагилин — необратимый ингибитор МАО-B, как
  # селегилин [медик].
  - id: maoi_b
    type: interaction
    level: contraindicated
    condition: taking_group('maoi_irreversible')
    text: >-
      Противопоказан вместе с необратимыми ингибиторами МАО-B из-за риска серотонинового синдрома. Так в
      листке-вкладыше, в ОХЛП для селегилина сказано «соблюдать осторожность».
    source:
      document: Листок-вкладыш «Ципралекс» из ГРЛС
      section: 2. О чём следует знать перед приёмом, «Другие препараты и препарат Ципралекс»
      url: https://grls.minzdrav.gov.ru/InstrImg/2025/10/31/1523077/f3b1f4c4-b635-4e9b-9a49-9cca43b48fd4.pdf
      quote: >-
        Одновременный прием препарата Ципралекс противопоказан со следующими препаратами: … необратимые ингибиторы
        МАО-В, содержащие селегилин (применяется для лечения болезни Паркинсона). Одновременный прием препаратов,
        содержащих селегилин, с препаратом Ципралекс повышает риск развития серотонинового синдрома…

  - id: qt
    type: contraindication
    level: contraindicated
    condition: fact('qt_prolongation')
    text: Противопоказан при удлинении интервала QT или врождённом синдроме удлинённого QT.
    source:
      document: ОХЛП «Ципралекс», реестр ЕАЭС
      section: 4.3. Противопоказания
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: Эсциталопрам противопоказан пациентам с зарегистрированным удлинением интервала QT или с врожденным синдромом удлиненного интервала QT.

  - id: qt_drugs
    type: interaction
    level: contraindicated
    condition: taking_group('qt_prolonging')
    text: Противопоказан вместе с препаратами, удлиняющими интервал QT. Листок-вкладыш прямо называет гидроксизин.
    source:
      document: Листок-вкладыш «Ципралекс» из ГРЛС
      section: 2. О чём следует знать перед приёмом, «Другие препараты и препарат Ципралекс»
      url: https://grls.minzdrav.gov.ru/InstrImg/2025/10/31/1523077/f3b1f4c4-b635-4e9b-9a49-9cca43b48fd4.pdf
      quote: >-
        …некоторые антигистаминные препараты (астемизол, гидроксизин, мизоластин). Вы не должны принимать ни один
        из указанных выше лекарственных препаратов одновременно с препаратом Ципралекс.

  - id: pregnancy
    type: contraindication
    level: contraindicated
    condition: fact('pregnancy')
    text: При беременности назначают только в случаях крайней необходимости и после тщательной оценки пользы и риска.
    source:
      document: ОХЛП «Ципралекс», реестр ЕАЭС
      section: 4.6. Фертильность, беременность и лактация
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Лекарственный препарат Ципралекс следует принимать во время беременности только в случаях крайней
        необходимости и после тщательной оценки соотношения польза/риск.

  - id: lactation
    type: caution
    level: caution
    condition: fact('lactation')
    text: Во время лечения кормление грудью не рекомендуется.
    source:
      document: ОХЛП «Ципралекс», реестр ЕАЭС
      section: 4.6. Фертильность, беременность и лактация
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: Предполагается, что эсциталопрам будет выделяться в грудное молоко, поэтому во время лечения эсциталопрамом кормление грудью не рекомендуется.

  - id: mania
    type: caution
    level: caution
    condition: diagnosis('F31')
    text: С осторожностью при мании или гипомании в анамнезе. При развитии маниакальной фазы эсциталопрам отменяют.
    source:
      document: ОХЛП «Ципралекс», реестр ЕАЭС
      section: 4.4. Особые указания, «Мания»
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Эсциталопрам должен с осторожностью применяться у пациентов с манией/гипоманией в анамнезе. При развитии
        маниакальной фазы эсциталопрам должен быть отменен.

  - id: serotonergic
    type: interaction
    level: caution
    condition: taking_group('serotonergic')
    text: "С осторожностью вместе с другими серотонинергическими препаратами: возможен серотониновый синдром."
    source:
      document: ОХЛП «Ципралекс», реестр ЕАЭС
      section: 4.5. Взаимодействие, «Серотонинергические лекарственные препараты»
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Одновременный прием с серотонинергическими лекарственными препаратами, например, опиоидами (включая
        трамадол) и триптанами (включая суматриптан), может привести к развитию серотонинового синдрома.

  - id: bleeding
    type: interaction
    level: caution
    condition: taking_group('bleeding')
    text: >-
      С осторожностью вместе с пероральными антикоагулянтами и препаратами, влияющими на функцию тромбоцитов
      (ацетилсалициловая кислота, НПВС, тиклопидин, дипиридамол): растёт риск кровотечений.
    source:
      document: ОХЛП «Ципралекс», реестр ЕАЭС
      section: 4.4. Особые указания, «Кровотечение»
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Препарат следует применять с осторожностью у пациентов, одновременно принимающих пероральные антикоагулянты;
        лекарственные средства, влияющие на тромбоцитарную функцию (например, атипичные антипсихотики, фенотиазины,
        большинство трициклических антидепрессантов, ацетилсалициловую кислоту и нестероидные противовоспалительные
        препараты (НПВП), тиклопидин и дипиридамол)…

  - id: cyp2c19
    type: interaction
    level: caution
    condition: taking_group('cyp2c19_inhibitor')
    text: >-
      С осторожностью вместе с ингибиторами CYP2C19 (омепразол, эзомепразол, лансопразол, флуконазол, флувоксамин):
      концентрация эсциталопрама растёт, может понадобиться снизить дозу.
    source:
      document: ОХЛП «Ципралекс», реестр ЕАЭС
      section: 4.5. Взаимодействие, «Влияние других лекарственных препаратов на фармакокинетику эсциталопрама»
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Таким образом, следует соблюдать осторожность при приеме эсциталопрама одновременно с ингибиторами изофермента
        CYP2C19 (например, омепразолом, эзомепразолом, флуконазолом, флувоксамином, лансопразолом, тиклопидином) и
        циметидином. При одновременном приеме может потребоваться снижение дозы эсциталопрама на основе мониторинга
        побочных реакций…

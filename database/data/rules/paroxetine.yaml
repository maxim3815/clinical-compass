# Правила проверки назначения пароксетина. Источник — оригинальный препарат «Паксил».
# Загружаются командой `php artisan app:rules:import`, формат и язык условий описаны в README.
#
# Источник — общая характеристика (ОХЛП) «Паксила» из реестра ЕАЭС. Ссылка на сам файл одноразовая,
# поэтому у правил ссылка на реестр, препарат ищется по названию.
# Тексты, уровни и коды МКБ-10 показаний проверяет медик команды [медик].

drug: paroxetine
rules:
  - id: indications
    type: indication
    level: contraindicated
    # Депрессивные эпизоды средней и тяжёлой степени — F32.1–F32.3, рекуррентное депрессивное
    # расстройство — F33, ОКР — F42, паника — F41.0 и F40.0, социальная фобия — F40.1, ГТР — F41.1,
    # ПТСР — F43.1 [медик].
    codes: [F32.1, F32.2, F32.3, F33, F42, F41.0, F40.0, F40.1, F41.1, F43.1]
    text: >-
      Назначение вне зарегистрированных показаний. Пароксетин показан взрослым при депрессивных эпизодах средней
      и тяжёлой степени, рекуррентном депрессивном расстройстве, ОКР, паническом расстройстве, социальной фобии,
      ГТР и ПТСР.
    source:
      document: ОХЛП «Паксил», реестр ЕАЭС
      section: 4.1. Показания к применению
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Препарат показан к применению у взрослых пациентов в возрасте от 18 лет для лечения следующих
        заболеваний: депрессивные эпизоды средней и тяжелой степени тяжести, рекуррентное депрессивное
        расстройство; обсессивно-компульсивное расстройство; паническое расстройство…

  - id: age
    type: contraindication
    level: contraindicated
    condition: age() < 18
    text: Противопоказан детям и подросткам до 18 лет.
    source:
      document: ОХЛП «Паксил», реестр ЕАЭС
      section: 4.3. Противопоказания
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: Пароксетин противопоказан для применения у детей и подростков в возрасте до 18 лет.

  - id: maoi
    type: contraindication
    level: contraindicated
    condition: taking_group('maoi') or fact('maoi')
    text: Противопоказан вместе с ингибиторами МАО. После необратимых ИМАО — не раньше чем через 2 недели.
    source:
      document: ОХЛП «Паксил», реестр ЕАЭС
      section: 4.3. Противопоказания
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Пароксетин противопоказан в комбинации с ингибиторами моноаминоксидазы (ИМАО). Лечение пароксетином
        допускается через 2 недели после прекращения лечения необратимыми ИМАО.

  - id: pregnancy
    type: caution
    level: caution
    condition: fact('pregnancy')
    text: >-
      При беременности рассмотрите альтернативное лечение: растёт риск пороков сердечно-сосудистой системы у плода.
      Назначают, только если польза превышает возможный риск.
    source:
      document: ОХЛП «Паксил», реестр ЕАЭС
      section: 4.6. Фертильность, беременность и лактация
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Врачу необходимо рассмотреть возможность альтернативного лечения беременных и планирующих беременность
        женщин при назначении пароксетина. Пароксетин следует назначать только в случае, если его потенциальная
        польза превышает возможный риск.

  - id: lactation
    type: caution
    level: caution
    condition: fact('lactation')
    text: Во время грудного вскармливания не принимают, кроме случаев, когда польза превышает риск.
    source:
      document: ОХЛП «Паксил», реестр ЕАЭС
      section: 4.6. Фертильность, беременность и лактация
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: Пароксетин не следует принимать во время грудного вскармливания за исключением тех случаев, когда его польза для матери превышает возможный риск для ребенка.

  - id: mania
    type: caution
    level: caution
    condition: diagnosis('F31')
    text: С осторожностью при мании в анамнезе. Пароксетин не предназначен для лечения депрессивного эпизода в рамках биполярного расстройства.
    source:
      document: ОХЛП «Паксил», реестр ЕАЭС
      section: 4.4. Особые указания, «Мания и биполярное расстройство»
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Пароксетин не предназначен для лечения депрессивного эпизода в рамках биполярного расстройства. Как и
        другие антидепрессанты, пароксетин следует применять с осторожностью у пациентов, имеющих в анамнезе манию.

  - id: qt
    type: caution
    level: caution
    condition: fact('qt_prolongation')
    text: С осторожностью при удлинении интервала QT в анамнезе.
    source:
      document: ОХЛП «Паксил», реестр ЕАЭС
      section: 4.4. Особые указания
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: Пароксетин следует применять с осторожностью у пациентов с удлинением интервала QT в анамнезе.

  - id: qt_drugs
    type: interaction
    level: caution
    condition: taking_group('qt_prolonging')
    text: С осторожностью у пациентов, которые принимают препараты, удлиняющие интервал QT.
    source:
      document: ОХЛП «Паксил», реестр ЕАЭС
      section: 4.4. Особые указания
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: Пароксетин следует применять с осторожностью у пациентов, принимающих антиаритмические или другие препараты, которые потенциально могут удлинять интервал QT.

  - id: serotonergic
    type: interaction
    level: caution
    condition: taking_group('serotonergic')
    text: С серотонинергическими препаратами, в том числе другими СИОЗС, — осторожность и тщательный клинический мониторинг.
    source:
      document: ОХЛП «Паксил», реестр ЕАЭС
      section: 4.5. Взаимодействие, «Серотонинергические препараты»
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        При одновременном применении серотонинергических препаратов (таких как L-триптофан, препараты из группы
        триптанов, трамадол, препараты группы СИОЗС, литий, фентанил и препараты зверобоя продырявленного)
        с пароксетином необходимо соблюдать осторожность и проводить тщательный клинический мониторинг.

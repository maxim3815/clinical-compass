# Правила проверки назначения сертралина. Источник — оригинальный препарат «Золофт».
# Загружаются командой `php artisan app:rules:import`, формат и язык условий описаны в README.
#
# Источники:
# - общая характеристика (ОХЛП) «Золофта» из реестра ЕАЭС. Ссылка на сам файл одноразовая, поэтому
#   у правил ссылка на реестр, препарат ищется по названию;
# - листок-вкладыш «Золофта» из ГРЛС, 2026.
# Тексты, уровни и коды МКБ-10 показаний проверяет медик команды [медик].

drug: sertraline
rules:
  - id: indications
    type: indication
    level: contraindicated
    # Большое депрессивное расстройство — F32 и F33, паника — F41.0 и F40.0, ОКР — F42, социальная
    # тревога — F40.1, ПТСР — F43.1. ГТР в показаниях нет [медик].
    codes: [F32, F33, F41.0, F40.0, F42, F40.1, F43.1]
    text: >-
      Назначение вне зарегистрированных показаний. Сертралин показан при большом депрессивном расстройстве,
      паническом расстройстве, ОКР, социальном тревожном расстройстве и ПТСР. ГТР в показаниях нет.
    advice: В клинических рекомендациях по ГТР сертралин стоит в первой линии со знаком #, то есть вне инструкции.
    source:
      document: ОХЛП «Золофт», реестр ЕАЭС
      section: 4.1. Показания к применению
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Лекарственный препарат Золофт показан для лечения эпизодов большого депрессивного расстройства и
        профилактики рецидивов; панического расстройства с агорафобией или без нее; обсессивно-компульсивного
        расстройства; социального тревожного расстройства; посттравматического стрессового расстройства.

  - id: maoi
    type: contraindication
    level: contraindicated
    condition: taking_group('maoi') or fact('maoi')
    text: Противопоказан вместе с необратимыми ингибиторами МАО. Назначать не ранее чем через 14 дней после их отмены.
    source:
      document: ОХЛП «Золофт», реестр ЕАЭС
      section: 4.3. Противопоказания
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Назначение сертралина пациентам, получающим необратимые ингибиторы моноаминооксидазы (ИМАО),
        противопоказано. Сертралин следует назначать не ранее чем через 14 дней после прекращения терапии
        необратимыми ИМАО.

  - id: pregnancy
    type: caution
    level: caution
    condition: fact('pregnancy')
    text: При беременности не рекомендуется, кроме случаев, когда польза для матери превышает возможный риск для плода.
    source:
      document: ОХЛП «Золофт», реестр ЕАЭС
      section: 4.6. Фертильность, беременность и лактация
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Не рекомендуется применять сертралин во время беременности, за исключением случаев, когда предполагаемая
        польза лечения для матери превышает возможный риск для плода.

  - id: lactation
    type: caution
    level: caution
    condition: fact('lactation')
    text: При грудном вскармливании — только если ожидаемая польза превосходит возможный риск.
    source:
      document: Листок-вкладыш «Золофт» из ГРЛС
      section: 2. О чём следует знать перед приёмом, «Грудное вскармливание»
      url: https://grls.minzdrav.gov.ru/InstrImg/2026/06/25/1531405/0fb75e32-9d37-4219-9320-c62187c2ddc9.pdf
      quote: >-
        Сертралин следует применять у женщин во время грудного вскармливания только, если Ваш лечащий врач
        считает, что ожидаемая польза превосходит возможный риск.

  - id: mania
    type: caution
    level: caution
    condition: diagnosis('F31')
    text: С осторожностью при маниакальном или гипоманиакальном состоянии в анамнезе. При переходе в маниакальную фазу сертралин отменяют.
    source:
      document: ОХЛП «Золофт», реестр ЕАЭС
      section: 4.4. Особые указания, «Активация маниакального и гипоманиакального состояния»
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Сертралин следует применять с осторожностью у пациентов с наличием в анамнезе маниакального/
        гипоманиакального состояния. В случае перехода заболевания в маниакальную фазу терапию сертралином
        следует прекратить.

  - id: qt
    type: caution
    level: caution
    condition: fact('qt_prolongation') or fact('qt_risk_factors')
    text: С осторожностью при удлинении интервала QT и факторах риска его удлинения.
    source:
      document: ОХЛП «Золофт», реестр ЕАЭС
      section: 4.4. Особые указания, «Удлинение интервала QTc»
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        У пациентов с дополнительными факторами риска удлинения интервала QTc, такими как заболевание
        сердечно-сосудистой системы, гипокалиемия или гипомагниемия, удлинение интервала QTc в семейном анамнезе,
        брадикардия и одновременное применение лекарственных средств, удлиняющих интервал QTc, сертралин следует
        применять с осторожностью.

  - id: qt_drugs
    type: interaction
    level: caution
    condition: taking_group('qt_prolonging')
    text: Вместе с препаратами, удлиняющими интервал QT, повышается риск удлинения QT и желудочковых аритмий.
    source:
      document: ОХЛП «Золофт», реестр ЕАЭС
      section: 4.5. Взаимодействие, «Препараты, увеличивающие интервал QT»
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Риск удлинения интервала QTc и (или) развития желудочковых аритмий может повышаться при одновременном
        применении сертралина и других лекарственных препаратов, увеличивающих интервал QTc.

  - id: serotonergic
    type: interaction
    level: caution
    condition: taking_group('serotonergic')
    text: Другие серотонинергические препараты, в том числе антидепрессанты, назначают с осторожностью.
    source:
      document: ОХЛП «Золофт», реестр ЕАЭС
      section: 4.5. Взаимодействие, «Другие серотонинергические препараты»
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Опиоиды и другие серотонинергические препараты (включая серотонинергические антидепрессанты, амфетамины,
        триптаны) рекомендуется назначать с осторожностью.

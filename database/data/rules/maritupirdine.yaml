# Правила проверки назначения «Авиандра» (маритупирдин). Загружаются командой
# `php artisan app:rules:import`, формат и язык условий описаны в README.
#
# Источники:
# - общая характеристика (ОХЛП) из реестра ЕАЭС. Ссылка на сам файл одноразовая, поэтому у правил
#   ссылка на реестр, препарат ищется по названию;
# - листок-вкладыш из ГРЛС, Изм. № 0, 2026.
# Тексты, уровни и коды МКБ-10 показаний проверяет медик команды [медик].

drug: maritupirdine
rules:
  - id: indications
    type: indication
    level: contraindicated
    # В инструкции кодов МКБ-10 нет: F41.1 — ГТР, F43.2 — расстройство приспособительных реакций
    # («стрессовая реакция и нарушение адаптации» после COVID-19) [медик].
    codes: [F41.1, F43.2]
    text: >-
      Назначение вне зарегистрированных показаний. «Авиандр» показан взрослым при генерализованном тревожном
      расстройстве и тревожных состояниях после COVID-19 у пациентов со стрессовой реакцией и нарушением адаптации.
    advice: Депрессия, паническое расстройство и социальная тревога в показаниях не значатся.
    source:
      document: ОХЛП «Авиандр», реестр ЕАЭС
      section: 4.1. Показания к применению
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Препарат АВИАНДР показан к применению у взрослых старше 18 лет для лечения: генерализованного
        тревожного расстройства; при тревожных состояниях после перенесенной коронавирусной инфекции (COVID-19)
        у пациентов со стрессовой реакцией и нарушением адаптации, легкой и средней степени выраженности.

  - id: age
    type: contraindication
    level: contraindicated
    condition: age() < 18
    text: Не назначают до 18 лет, данных по эффективности и безопасности нет.
    source:
      document: ОХЛП «Авиандр», реестр ЕАЭС
      section: 4.2. Режим дозирования, «Дети»
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: Данные по эффективности и безопасности у детей и подростков до 18 лет отсутствуют. Препарат не следует назначать детям до 18 лет.

  - id: epilepsy
    type: contraindication
    level: contraindicated
    condition: fact('epilepsy')
    text: Противопоказан при эпилепсии и органических заболеваниях головного мозга.
    source:
      document: ОХЛП «Авиандр», реестр ЕАЭС
      section: 4.3. Противопоказания
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: Эпилепсия и органические заболевания головного мозга.

  - id: maoi
    type: contraindication
    level: contraindicated
    condition: taking_group('maoi') or fact('maoi')
    text: Противопоказан одновременно с ингибиторами МАО и в течение 14 дней после их отмены.
    source:
      document: ОХЛП «Авиандр», реестр ЕАЭС
      section: 4.3. Противопоказания
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: Прием одновременно с ингибиторами моноаминоксидазы (МАО) и в течение 2 недель после их отмены.

  - id: gfr
    type: contraindication
    level: contraindicated
    condition: fact('gfr') < 60
    text: Противопоказан при почечной недостаточности средней и тяжёлой степени (СКФ < 60 мл/мин).
    source:
      document: ОХЛП «Авиандр», реестр ЕАЭС
      section: 4.3. Противопоказания
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: Почечная недостаточность средней и тяжелой степени (СКФ <60 мл/мин).

  - id: hepatic
    type: contraindication
    level: contraindicated
    condition: fact('hepatic_impairment') != 'none'
    text: Противопоказан при печёночной недостаточности любой степени (классы A, B и C по Чайлд-Пью).
    source:
      document: ОХЛП «Авиандр», реестр ЕАЭС
      section: 4.3. Противопоказания
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: Печеночная недостаточность легкой, средней и тяжелой степени (класс А, В и С по классификации Чайлд-Пью).

  - id: pregnancy
    type: contraindication
    level: contraindicated
    condition: fact('pregnancy')
    text: Противопоказан при беременности.
    advice: >-
      По ОХЛП назначить можно, только если потенциальная польза для матери превышает возможный риск для плода
      и другого лечения нет. Если назначаете, укажите это в обосновании.
    source:
      document: ОХЛП «Авиандр», реестр ЕАЭС
      section: 4.6. Фертильность, беременность и лактация
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Маритупирдин не следует назначать во время беременности, за исключением случаев, когда потенциальная
        польза для матери превышает возможный риск для плода, и нет других альтернативных методов лечения.

  - id: lactation
    type: contraindication
    level: contraindicated
    condition: fact('lactation')
    text: Противопоказан в период грудного вскармливания.
    advice: "Если препарат необходим, решите, что прекратить: грудное вскармливание или лечение."
    source:
      document: ОХЛП «Авиандр», реестр ЕАЭС
      section: 4.6. Фертильность, беременность и лактация
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Маритупирдин противопоказан в период грудного вскармливания. В случае необходимости применения
        маритупирдина в период лактации, необходимо решить вопрос о прекращении грудного вскармливания либо
        об отмене терапии.

  - id: cardiovascular
    type: caution
    level: caution
    condition: fact('cardiovascular')
    text: С осторожностью при сердечно-сосудистых заболеваниях, клинических данных мало.
    source:
      document: ОХЛП «Авиандр», реестр ЕАЭС
      section: 4.4. Особые указания, «Сердечно-сосудистые нарушения»
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Вследствие недостаточности клинических данных, маритупирдин должен применяться с осторожностью у пациентов
        с сердечно-сосудистыми заболеваниями.

  - id: endocrine
    type: caution
    level: caution
    condition: fact('diabetes_endocrine')
    text: С осторожностью при сахарном диабете и других эндокринных заболеваниях.
    source:
      document: Листок-вкладыш «Авиандр» из ГРЛС
      section: 2. О чём следует знать перед приёмом, «Особые указания и меры предосторожности»
      url: https://grls.minzdrav.gov.ru/InstrImg/2026/07/29/1532717/94ba54dc-ce1c-40ed-96f4-5c3a31f13805.pdf
      quote: Обязательно сообщите Вашему лечащему врачу и принимайте препарат АВИАНДР с осторожностью, если у Вас сахарный диабет или другие эндокринные заболевания.

  - id: dependence
    type: caution
    level: caution
    condition: fact('substance_dependence')
    text: С осторожностью при алкогольной или наркотической зависимости.
    source:
      document: Листок-вкладыш «Авиандр» из ГРЛС
      section: 2. О чём следует знать перед приёмом, «Особые указания и меры предосторожности»
      url: https://grls.minzdrav.gov.ru/InstrImg/2026/07/29/1532717/94ba54dc-ce1c-40ed-96f4-5c3a31f13805.pdf
      quote: Обязательно сообщите Вашему лечащему врачу и принимайте препарат АВИАНДР с осторожностью, если Вы страдаете алкогольной или наркотической зависимостью.

  - id: serotonergic
    type: interaction
    level: caution
    condition: taking_group('serotonergic')
    text: С осторожностью вместе с серотонинергическими препаратами, в том числе СИОЗС, из-за риска серотонинового синдрома.
    source:
      document: ОХЛП «Авиандр», реестр ЕАЭС
      section: 4.5. Взаимодействие, «Лекарственные препараты с серотонинергическим действием»
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Следует с осторожностью принимать маритупирдин с другими серотонинергическими препаратами (L-триптофан,
        препараты из группы триптанов, трамадол, препараты группы селективных ингибиторов обратного захвата
        серотонина (СИОЗС), трициклические антидепрессанты, литий, фентанил и Зверобой продырявленный).

  - id: cyp2d6
    type: interaction
    level: caution
    condition: taking_group('cyp2d6_inhibitor')
    text: "С осторожностью вместе с ингибиторами CYP2D6, в том числе СИОЗС: может вырасти концентрация маритупирдина."
    source:
      document: ОХЛП «Авиандр», реестр ЕАЭС
      section: 4.5. Взаимодействие, «Ингибиторы изофермента CYP2D6»
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Следует с осторожностью применять маритупирдин с ингибиторами CYP2D6 (например, дифенгидрамин,
        тербинафин, хинидин, гидроксихлорохин, препараты СИОЗС).

  - id: sedative
    type: interaction
    level: caution
    condition: taking_group('sedative')
    text: "С осторожностью вместе с препаратами седативного действия: седация может усилиться."
    source:
      document: ОХЛП «Авиандр», реестр ЕАЭС
      section: 4.5. Взаимодействие, «Лекарственные препараты с седативными свойствами»
      url: https://lk.regmed.ru/Register/EAEU_SmPC
      quote: >-
        Маритупирдин может усиливать седативный эффект производных бензодиазепина, нейролептиков, барбитуратов,
        блокаторов Н1-рецепторов. Следует проявлять осторожность при назначении этих лекарственных препаратов
        вместе с маритупирдин.

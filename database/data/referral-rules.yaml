# Подсказка направления к психиатру в кабинете терапевта: когда «обязательно», когда «желательно».
# Загружается командой `php artisan app:referral-rules:import` после шкал и видов фактов, формат
# описан в README.
#
# Условие — выражение, как у правил алертинга, над последними шкалами пациента за 14 дней,
# HARS, заполненной сегодня, и фактами клинического профиля:
#   answer('phq9', 9) — балл ответа на 9-й вопрос PHQ-9;
#   total('hars') — сумма баллов шкалы;
#   fact('mania_signs') — текущее значение факта (у признака без записи — нет).
# Правило про шкалу, которой у пациента нет, не проверяется. Категорию подсказки задаёт самое
# сильное сработавшее правило, в основании — все сработавшие.
#
# Пороги, тексты и источники проверяет медик команды [медик].

- code: suicidal_thoughts
  category: required
  condition: answer('phq9', 9) >= 1
  text: >-
    Мысли о том, что лучше умереть, или о причинении себе вреда (PHQ-9, 9-й вопрос). Суицидальный риск
    оценивает психиатр.
  source:
    document: Клинические рекомендации «Депрессивный эпизод, рекуррентное депрессивное расстройство» (ID 301_3)
    section: 2.1 Жалобы и анамнез
    url: https://cr.minzdrav.gov.ru/view-cr/301_3
    quote: >-
      Всем пациентам с целью первичной диагностики рекомендуется прием (осмотр, консультация) врача-психиатра
      первичный с психопатологическим обследованием и оценкой риска суицидального поведения…

- code: mania_signs
  category: required
  condition: fact('mania_signs')
  text: >-
    Признаки мании или гипомании: подозрение на биполярное аффективное расстройство, антидепрессант
    может вызвать инверсию аффекта.
  source:
    document: Клинические рекомендации «Генерализованное тревожное расстройство» (ID 457_3)
    section: 5. Профилактика
    url: https://cr.minzdrav.gov.ru/view-cr/457_3
    quote: >-
      Всем пациентам с ГТР рекомендуется диспансерное наблюдение врачом-психиатром в случаях наличия
      суицидального риска, тяжелого течения, коморбидной психической патологии, резистентности к терапии.

- code: psychotic_symptoms
  category: required
  condition: fact('psychotic_symptoms')
  text: Бред или галлюцинации.
  source:
    document: Клинические рекомендации «Депрессивный эпизод, рекуррентное депрессивное расстройство» (ID 301_3)
    section: 3. Лечение
    url: https://cr.minzdrav.gov.ru/view-cr/301_3
    quote: >-
      При наличии показаний (например, в случае выявления психотических симптомов и суицидальных мыслей)
      следует рассмотреть вопрос о стационарном лечении.

- code: hars_severe
  category: required
  condition: total('hars') >= 25
  text: Тяжёлая степень тревоги по HARS (25 баллов и больше).
  source:
    document: Клинические рекомендации «Генерализованное тревожное расстройство» (ID 457_3)
    section: 6. Организация оказания медицинской помощи
    url: https://cr.minzdrav.gov.ru/view-cr/457_3
    quote: >-
      Показания для госпитализации в медицинскую организацию: выраженная тревога, требующая подбора
      фармакотерапии в стационаре.

- code: phq9_severe
  category: required
  condition: total('phq9') >= 20
  text: Тяжёлая депрессия по PHQ-9 (20 баллов и больше). Депрессию диагностирует и ведёт психиатр.
  source:
    document: Клинические рекомендации «Депрессивный эпизод, рекуррентное депрессивное расстройство» (ID 301_3)
    section: 6. Организация оказания медицинской помощи
    url: https://cr.minzdrav.gov.ru/view-cr/301_3
    quote: >-
      Показаниями для проведения стационарного лечения являются: ДЭ тяжелой степени без психотических
      симптомов или с психотическими симптомами.

- code: hars_moderate
  category: desirable
  condition: total('hars') >= 18 and total('hars') <= 24
  text: Средняя выраженность тревоги по HARS (18–24 балла).
  source:
    document: Клинические рекомендации «Генерализованное тревожное расстройство» (ID 457_3)
    section: 5. Профилактика
    url: https://cr.minzdrav.gov.ru/view-cr/457_3
    quote: >-
      Всем пациентам с ГТР рекомендуется наблюдение и курация врачом-психотерапевтом или врачом-психиатром
      для коррекции терапии и корректной ее отмены, проведении психотерапии.

- code: gad7_severe
  category: desirable
  condition: total('gad7') >= 15
  text: Выраженная тревога по GAD-7 (15 баллов и больше).
  source:
    document: Клинические рекомендации «Генерализованное тревожное расстройство» (ID 457_3)
    section: 5. Профилактика
    url: https://cr.minzdrav.gov.ru/view-cr/457_3
    quote: >-
      Всем пациентам с ГТР рекомендуется наблюдение и курация врачом-психотерапевтом или врачом-психиатром
      для коррекции терапии и корректной ее отмены, проведении психотерапии.

- code: phq9_moderate
  category: desirable
  condition: total('phq9') >= 10 and total('phq9') <= 19
  text: Умеренная или умеренно тяжёлая депрессия по PHQ-9 (10–19 баллов). Депрессию диагностирует психиатр.
  source:
    document: Клинические рекомендации «Депрессивный эпизод, рекуррентное депрессивное расстройство» (ID 301_3)
    section: 2. Диагностика
    url: https://cr.minzdrav.gov.ru/view-cr/301_3
    quote: >-
      Первичная оценка депрессивного синдрома и постановка диагноза и должна проводиться врачом-психиатром.

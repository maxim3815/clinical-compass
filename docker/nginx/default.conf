server_tokens off;

# Healthcheck дёргает /up каждые несколько секунд, в лог его не пишем.
map $request_uri $loggable {
    /up     0;
    default 1;
}

# Заголовок Connection для WebSocket: upgrade при переходе на WebSocket, иначе close.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 20m;

    access_log /var/log/nginx/access.log main if=$loggable;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # WebSocket Reverb. Адрес контейнера ищется при каждом запросе через DNS Docker:
    # если reverb остановлен, nginx всё равно запускается, а приложение работает без обновлений
    # в реальном времени.
    location ^~ /app/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $reverb http://reverb:8080;
        proxy_pass $reverb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Клиент пингует соединение после 30 секунд тишины, сервер — после 60.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Service worker и манифест браузер перепроверяет при каждом открытии приложения,
    # иначе новая версия дойдёт до пациента не сразу. Service worker появляется после
    # сборки ассетов, без неё — 404, а не страница Laravel.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server_tokens off;

# В продакшене nginx стоит за прокси с TLS. Адрес клиента и схему прокси передаёт в заголовках
# X-Forwarded-*: в php они доходят как есть, а Laravel верит им от адресов частных сетей.
# В лог пишется адрес клиента от прокси и время ответа.
log_format timed '$remote_addr "$http_x_forwarded_for" [$time_local] "$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';

# Healthcheck дёргает /up каждые несколько секунд, в лог его не пишем.
map $request_uri $loggable {
    /up     0;
    default 1;
}

# Заголовок Connection для WebSocket: upgrade при переходе на WebSocket, иначе close.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Схема от внешнего прокси, а без прокси — своя.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 20m;

    # Адреса php и reverb ищутся через DNS Docker при каждом запросе, а не один раз при запуске:
    # контейнер, пересозданный без nginx, получает новый адрес.
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /var/log/nginx/access.log timed if=$loggable;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Собранные ассеты: в имени хеш содержимого, поэтому кэшируются надолго.
    location ^~ /build/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # WebSocket Reverb. Если reverb остановлен, nginx всё равно запускается, а приложение
    # работает без обновлений в реальном времени.
    location ^~ /app/ {
        set $reverb http://reverb:8080;
        proxy_pass $reverb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Клиент пингует соединение после 30 секунд тишины, сервер — после 60.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Service worker и манифест браузер перепроверяет при каждом открытии приложения,
    # иначе новая версия дойдёт до пациента не сразу.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        set $php php:9000;
        fastcgi_pass $php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

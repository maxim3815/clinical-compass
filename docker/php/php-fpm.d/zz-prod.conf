; Продакшен, дополняет zz-app.conf.

[global]
; Трассировка стека из лога Laravel не режется на куски.
log_limit = 8192

[www]
; Процессы запускаются по запросу и завершаются после простоя: память нужна и другим сервисам.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
pm.max_requests = 500

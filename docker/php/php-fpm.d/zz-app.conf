[www]
listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Для healthcheck через cgi-fcgi.
ping.path = /ping
ping.response = pong

; Запросы и так пишет nginx, а лог fpm забивали бы ещё и healthcheck'и.
access.log = /dev/null

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

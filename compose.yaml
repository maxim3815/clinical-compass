name: clinical-compass

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-php-build: &php-build
  context: .
  dockerfile: docker/php/Dockerfile
  args:
    UID: ${UID:-1000}
    GID: ${GID:-1000}
    XDEBUG: ${XDEBUG:-false}

# Образ собирает сервис php, остальные PHP-сервисы используют его же.
x-php-image: &php-image
  image: clinical-compass/php:dev
  restart: on-failure
  logging: *logging
  volumes:
    - .:/var/www/html

services:
  nginx:
    image: nginx:1.30-alpine
    restart: on-failure
    logging: *logging
    ports:
      - 127.0.0.1:${APP_PORT:-8080}:80
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

  php:
    <<: *php-image
    build:
      <<: *php-build
      target: dev
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      PHP_IDE_CONFIG: serverName=clinical-compass
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

  node:
    <<: *php-image
    init: true
    command: ["sh", "-c", "[ -d node_modules ] || npm ci; exec npm run dev"]
    environment:
      VITE_PORT: ${VITE_PORT:-5173}
    ports:
      - 127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:$${VITE_PORT}/@vite/client"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s

  postgres:
    image: postgres:18.6-trixie
    restart: on-failure
    logging: *logging
    ports:
      - 127.0.0.1:${FORWARD_DB_PORT:-54320}:5432
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is not set, run make init}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is not set, run make init}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, run make init}
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # По TCP, а не через сокет: во время init-скриптов временный сервер слушает только сокет.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  queue:
    <<: *php-image
    init: true
    # Через очередь уходят события чата: пустую очередь проверяем раз в секунду, а не раз в три.
    # Очередь alerts (проверка правил алертинга) воркер берёт раньше остальных.
    command: ["php", "artisan", "queue:listen", "--queue=alerts,default", "--tries=1", "--sleep=1"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "artisan queue:listen"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # WebSocket-сервер для обновлений без перезагрузки страницы. Браузер подключается к нему
  # через nginx, приложение отправляет события напрямую. Порт наружу не публикуется.
  reverb:
    <<: *php-image
    init: true
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

  scheduler:
    <<: *php-image
    init: true
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "artisan schedule:work"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Тесты с браузером: make test. В обычный запуск окружения не входит.
  tests:
    <<: *php-image
    image: clinical-compass/php:test
    build:
      <<: *php-build
      target: test
    profiles: ["test"]
    restart: "no"
    init: true
    command: ["php", "artisan", "test"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
